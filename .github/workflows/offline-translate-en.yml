name: Offline English translation

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/offline-translate-en.yml"
      - ".translation/config.json"
      - ".translation/glossary.txt"
      - ".translation/path-map.json"
      - ".translation/path-overrides.json"
      - "scripts/build-translation-path-map.mjs"
      - "scripts/merge-translation-shards.mjs"
      - "scripts/translate-markdown.mjs"
      - "scripts/translate-markdown.test.mjs"
      - "package.json"
      - "!en/**"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Translation mode
        required: true
        default: backfill
        type: choice
        options:
          - backfill
          - changed
      max_files:
        description: Maximum Markdown files in this run
        required: true
        default: "3"
      base_sha:
        description: Optional base commit for changed mode
        required: false
        default: ""
      head_sha:
        description: Optional head commit for changed mode
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/offline-translate-en.yml"
      - ".translation/**"
      - "scripts/translate-markdown.mjs"
      - "scripts/translate-markdown.test.mjs"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: offline-english-translation
  cancel-in-progress: false

env:
  LLAMA_VERSION: b10593
  LLAMA_ARCHIVE_SHA256: fb3479dcb6b8ced8d785585af991b9ffa6ce605b51fc06229c1770544922a0db
  MODEL_URL: https://huggingface.co/tencent/Hy-MT2-1.8B-GGUF/resolve/main/Hy-MT2-1.8B-Q4_K_M.gguf
  MODEL_SHA256: dc5f44fcf1fa496ee7ad725982c0c8c553a4de00259b53af84c4b89fb0c06699
  MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/hy-mt2
  TRANSLATION_SERVER_URL: http://127.0.0.1:8080

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:translation

  model-smoke-test:
    if: github.event_name == 'pull_request'
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.MODEL_CACHE_DIR }}
          key: hy-mt2-q4-${{ env.MODEL_SHA256 }}
      - name: Install pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/llama.tar.gz"
          curl --fail --location --retry 5 \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-bin-ubuntu-x64.tar.gz" \
            --output "$archive"
          echo "${LLAMA_ARCHIVE_SHA256}  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/llama"
          tar -xzf "$archive" -C "$RUNNER_TEMP/llama"
          server="$(find "$RUNNER_TEMP/llama" -type f -name llama-server -print -quit)"
          chmod +x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
      - name: Download pinned offline model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_CACHE_DIR"
          model="$MODEL_CACHE_DIR/Hy-MT2-1.8B-Q4_K_M.gguf"
          if [[ ! -f "$model" ]]; then
            curl --fail --location --retry 5 "$MODEL_URL" --output "$model"
          fi
          echo "${MODEL_SHA256}  $model" | sha256sum --check
          echo "MODEL_PATH=$model" >> "$GITHUB_ENV"
      - name: Start local translation server
        shell: bash
        run: |
          set -euo pipefail
          nohup "$LLAMA_SERVER" \
            --model "$MODEL_PATH" --host 127.0.0.1 --port 8080 \
            --ctx-size 8192 --threads 4 --jinja \
            > "$RUNNER_TEMP/llama-server.log" 2>&1 &
          for _ in {1..180}; do
            if curl --silent --fail http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/llama-server.log"
          exit 1
      - name: Translate one protected Markdown sentence
        run: |
          node --input-type=module <<'NODE'
          import { createHttpTranslator, translateMarkdown } from './scripts/translate-markdown.mjs';
          const translate = createHttpTranslator(process.env.TRANSLATION_SERVER_URL);
          const output = await translateMarkdown('请查看 [项目](https://example.com)，并运行 `VLA` 完成抓取。\n', {
            translate,
            glossary: '',
            maxBlockChars: 1000
          });
          console.log(output);
          if (
            /[\u3400-\u9fff]/u.test(output)
            || !output.includes('`VLA`')
            || !/\[[^\]]+\]\(https:\/\/example\.com\)/.test(output)
          ) process.exit(1);
          NODE

  translate:
    if: github.event_name != 'pull_request'
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Plan translation work
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'backfill' }}
          REQUESTED_BASE: ${{ github.event.inputs.base_sha || '' }}
          REQUESTED_HEAD: ${{ github.event.inputs.head_sha || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            if git diff --quiet "$EVENT_BEFORE" "$EVENT_SHA" -- \
              '*.md' ':(exclude)en/**' ':(exclude).translation/**'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No changed Chinese Markdown files; translation is not needed."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "mode=changed" >> "$GITHUB_OUTPUT"
              echo "base=$EVENT_BEFORE" >> "$GITHUB_OUTPUT"
              echo "head=$EVENT_SHA" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_MODE" == "changed" ]]; then
            base="${REQUESTED_BASE:-${EVENT_SHA}^}"
            head="${REQUESTED_HEAD:-$EVENT_SHA}"
            git cat-file -e "${base}^{commit}"
            git cat-file -e "${head}^{commit}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "mode=changed" >> "$GITHUB_OUTPUT"
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "head=$head" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "mode=backfill" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.plan.outputs.skip == 'false'
        with:
          path: ${{ env.MODEL_CACHE_DIR }}
          key: hy-mt2-q4-${{ env.MODEL_SHA256 }}
      - name: Install pinned llama.cpp
        if: steps.plan.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/llama.tar.gz"
          curl --fail --location --retry 5 \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-bin-ubuntu-x64.tar.gz" \
            --output "$archive"
          echo "${LLAMA_ARCHIVE_SHA256}  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/llama"
          tar -xzf "$archive" -C "$RUNNER_TEMP/llama"
          server="$(find "$RUNNER_TEMP/llama" -type f -name llama-server -print -quit)"
          chmod +x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
      - name: Download pinned offline model
        if: steps.plan.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_CACHE_DIR"
          model="$MODEL_CACHE_DIR/Hy-MT2-1.8B-Q4_K_M.gguf"
          if [[ ! -f "$model" ]]; then
            curl --fail --location --retry 5 "$MODEL_URL" --output "$model"
          fi
          echo "${MODEL_SHA256}  $model" | sha256sum --check
          echo "MODEL_PATH=$model" >> "$GITHUB_ENV"
      - name: Start local translation server
        if: steps.plan.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          nohup "$LLAMA_SERVER" \
            --model "$MODEL_PATH" --host 127.0.0.1 --port 8080 \
            --ctx-size 8192 --threads 4 --jinja \
            > "$RUNNER_TEMP/llama-server.log" 2>&1 &
          for _ in {1..180}; do
            if curl --silent --fail http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/llama-server.log"
          exit 1
      - name: Translate changed or stale Markdown
        if: steps.plan.outputs.skip == 'false'
        shell: bash
        env:
          MAX_FILES: ${{ github.event.inputs.max_files || '3' }}
          MODE: ${{ steps.plan.outputs.mode }}
          BASE_SHA: ${{ steps.plan.outputs.base }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
        run: |
          set -euo pipefail
          npm run translation:paths
          if [[ "$MODE" == "changed" ]]; then
            node scripts/translate-markdown.mjs \
              --base "$BASE_SHA" --head "$HEAD_SHA" \
              --max-files "$MAX_FILES"
          else
            node scripts/translate-markdown.mjs --backfill --max-files "$MAX_FILES"
          fi
      - name: Reject leaked Markdown protection tokens
        if: steps.plan.outputs.skip == 'false'
        shell: bash
        run: |
          if grep -R --line-number --include='*.md' 'EE_KEEP_' en; then
            echo 'Protected Markdown token leaked into translated output.' >&2
            exit 1
          fi
          if grep -R --line-number --include='*.md' -E \
            'Strictly maintain the Markdown structure|translation must retain all separators' en; then
            echo 'Translation prompt text leaked into translated output.' >&2
            exit 1
          fi
      - name: Commit verified translations to main
        id: publish
        if: steps.plan.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git add .translation/path-map.json .translation/state.json en
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No translation changes were generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: 离线更新英文翻译"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated documentation
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
